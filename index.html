<!doctype html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <title>TenCate Likes Rocks</title>
  <meta name="description" content="A celebration of a wonderful human who loves rocks" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" type="text/css" href="style.css?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="manifest" href="?manifest">
</head>
<body>
<main>
  <div class="person block">
    <img src="https://dannybd.com/tencatelikesrocks/?person" alt="TenCate" />
  </div>
  <div class="likes block" onclick="toggleAnthem()">
    <img src="img/likes/heart.png" alt="Likes" />
    <div id="playpause">▶️</div>
  </div>
  <div class="rocks block">
    <img src="https://dannybd.com/tencatelikesrocks/?rocks" alt="Rocks" />
  </div>
</main>
<div style="text-align: center;" onclick="window.location.reload()">🔄</div>
<audio id="anthem" onended="resetPlayPause()">
  <source src="anthem.mp3" type="audio/mpeg">
</audio>
<script>
const anthem = document.getElementById('anthem');
const playpause = document.getElementById('playpause');
function toggleAnthem() {
  if (anthem.paused) {
    anthem.play();
    playpause.innerHTML = '⏸️';
  } else {
    anthem.pause();
    resetPlayPause();
  }
}

function resetPlayPause() {
  playpause.innerHTML = '▶️';
}
</script>
</body>
</html>
